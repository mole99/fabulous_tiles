meta:
  version: 2
  flow: FABulousTile
  substituting_steps:
    # IHP uses cumulative antenna rules
    # which aren't supported in repair yet
    OpenROAD.RepairAntennas: null
    # KLayout runs density check, TODO disable
    KLayout.DRC: null

FABULOUS_TILE_DIR: dir::. #tiles/IHP_SRAM

# Basics
DESIGN_NAME: OpenRAM
FABULOUS_SUPERTILE: true
VERILOG_FILES:
  - dir::../../models_pack.v
  - dir::../../custom.v
FABULOUS_EXTERNAL_SIDE: E

# Clock
CLOCK_PERIOD: 20
CLOCK_PORT: Tile_X0Y1_UserCLK

# Area
FP_SIZING: absolute
pdk::sky130A:
    # Height should be multiple of 0.68 (met3 pitch)
    # Width should be multiple of 0.46 (met2 pitch)
    DIE_AREA: [0, 0, 120.06, 519.52]
    PL_TARGET_DENSITY_PCT: 40
    
pdk::ihp-sg13g2:
    # Height should be multiple of 0.42 (Metal2 pitch)
    # Width should be multiple of 0.48 (Metal3 pitch)
    DIE_AREA: [0, 0, 231.84, 483.84]
    PL_TARGET_DENSITY_PCT: 80
